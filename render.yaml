# Render Blueprint — one-click deploy
# Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: ollama-smollm
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/tags
    envVars:
      - key: MODEL_NAME
        value: smollm:135m
      - key: OLLAMA_MODELS
        value: /models
      - key: OLLAMA_NUM_PARALLEL
        value: "1"
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: OLLAMA_CONTEXT_LENGTH
        value: "512"
      - key: OLLAMA_KEEP_ALIVE
        value: "1h"
      - key: OLLAMA_ORIGINS
        value: "*"
